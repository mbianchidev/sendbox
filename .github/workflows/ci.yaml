name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libelf-dev \
            libseccomp-dev \
            libzstd-dev \
            make \
            pkg-config \
            zlib1g-dev

      - name: Rust version
        run: rustc --version --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Compile fuzz targets
        run: |
          cargo check --locked --manifest-path fuzz/security/Cargo.toml --bins
          cargo check --locked --manifest-path fuzz/git/Cargo.toml --bins
          cargo check --locked --manifest-path fuzz/secrets/Cargo.toml --bins
          cargo check --locked --manifest-path fuzz/credentials/Cargo.toml --bins
          cargo check --locked --manifest-path fuzz/mcp/Cargo.toml --bins
          cargo check --locked --manifest-path fuzz/bpf/Cargo.toml --bins
          cargo check --locked --manifest-path fuzz/project/Cargo.toml
          cargo check --locked --manifest-path fuzz/config/Cargo.toml

      - name: Build debug and release workspaces
        run: |
          cargo build --locked --workspace
          cargo build --locked --workspace --release

      - name: Verify production CLI
        run: |
          ./target/release/sendbox --version
          ./target/release/sendbox policy validate \
            --config config/example-sandbox.yaml
          ./target/release/sendbox policy validate \
            --config config/example-sandbox.yaml \
            --json
          ./target/release/sendbox policy show --json
          ./target/release/sendbox completions print --shell bash >/dev/null
          ./target/release/sendbox analyze \
            --project crates/sendbox-project/tests/fixtures/node-ts \
            --json
          project="$(mktemp -d)"
          printf '{"dependencies":{"react":"19"}}\n' >"$project/package.json"
          ./target/release/sendbox devcontainer generate \
            --project "$project" \
            --json
          ./target/release/sendbox init --project "$project" --json
          mkdir "$project/home"
          home="$(cd "$project/home" && pwd -P)"
          HOME="$home" ./target/release/sendbox completions install \
            --shell fish \
            --json

      - name: Verify staged Cargo installation
        run: |
          raw_root="$(mktemp -d)"
          trap 'rm -rf "$raw_root"' EXIT
          install_root="$(cd "$raw_root" && pwd -P)"
          cargo install \
            --locked \
            --path crates/sendbox-cli \
            --root "$install_root"
          mkdir -m 0700 "$install_root/home"
          "$install_root/bin/sendbox" --version
          HOME="$install_root/home" \
            "$install_root/bin/sendbox" completions install \
              --shell fish \
              --json
          test -f \
            "$install_root/home/.config/fish/completions/sendbox.fish"

      - name: Qualify setup and release packaging
        env:
          SENDBOX_REQUIRE_SUDO: "1"
        run: ./scripts/qualify-setup-release.sh

  dependency-audit:
    name: Rust dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit dependencies
        run: cargo audit --deny warnings
