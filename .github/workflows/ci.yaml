name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.task == 'checks' && 'Rust' || 'Build and install' }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        os: [macos-15, ubuntu-24.04]
        task: [checks, build]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libelf-dev \
            libseccomp-dev \
            libzstd-dev \
            make \
            pkg-config \
            zlib1g-dev

      - name: Rust version
        run: rustc --version --verbose

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.task }}

      - name: Check formatting
        if: matrix.task == 'checks'
        run: cargo fmt --all -- --check

      - name: Test cold-start diagnostic harness
        if: matrix.task == 'checks'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s test-fixtures/dns-cold-start -p 'test_*.py'

      - name: Run Clippy
        if: matrix.task == 'checks'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        if: matrix.task == 'checks'
        run: cargo test --locked --workspace --all-features

      - name: Compile fuzz targets
        if: matrix.task == 'checks'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: make fuzz-check

      - name: Build debug and release workspaces
        if: matrix.task == 'build'
        run: |
          cargo build --locked --workspace
          cargo build --locked --workspace --release

      - name: Verify production CLI
        if: matrix.task == 'build'
        run: |
          ./target/release/sendbox --version
          ./target/release/sendbox policy validate \
            --config config/example-sandbox.yaml
          ./target/release/sendbox policy validate \
            --config config/example-sandbox.yaml \
            --json
          ./target/release/sendbox policy show --json
          ./target/release/sendbox completions print --shell bash >/dev/null
          ./target/release/sendbox analyze \
            --project crates/sendbox-project/tests/fixtures/node-ts \
            --json
          project="$(mktemp -d)"
          printf '{"dependencies":{"react":"19"}}\n' >"$project/package.json"
          ./target/release/sendbox devcontainer generate \
            --project "$project" \
            --json
          ./target/release/sendbox init --project "$project" --json
          mkdir "$project/home"
          home="$(cd "$project/home" && pwd -P)"
          HOME="$home" ./target/release/sendbox completions install \
            --shell fish \
            --json

      - name: Verify staged Cargo installation
        if: matrix.task == 'build'
        run: |
          raw_root="$(mktemp -d)"
          trap 'rm -rf "$raw_root"' EXIT
          install_root="$(cd "$raw_root" && pwd -P)"
          cargo install \
            --locked \
            --path crates/sendbox-cli \
            --root "$install_root"
          mkdir -m 0700 "$install_root/home"
          "$install_root/bin/sendbox" --version
          HOME="$install_root/home" \
            "$install_root/bin/sendbox" completions install \
              --shell fish \
              --json
          test -f \
            "$install_root/home/.config/fish/completions/sendbox.fish"

      - name: Qualify setup and release packaging
        if: matrix.task == 'build'
        env:
          SENDBOX_REQUIRE_SUDO: "1"
        run: ./scripts/qualify-setup-release.sh

  dependency-audit:
    name: Rust dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache cargo-audit executable
        id: audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2

      - name: Install cargo-audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit dependencies
        run: cargo audit --deny warnings
