name: Production guest BPF and artifacts

on:
  push:
    branches: [main]
    paths:
      - ".cargo/config.toml"
      - ".github/workflows/guest-artifacts.yaml"
      - ".github/workflows/release.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/sendbox-bpf/**"
      - "crates/sendbox-bundle/**"
      - "crates/sendbox-exec/**"
      - "fuzz/bpf/**"
      - "guest/sendbox-guest/**"
      - "native/bpf/**"
      - "packaging/guest/**"
      - "packaging/release/**"
      - "scripts/qualify-setup-release.sh"
      - "setup.sh"
      - "docs/architecture/guest-artifact-bundles.md"
  pull_request:
    branches: [main]
    paths:
      - ".cargo/config.toml"
      - ".github/workflows/guest-artifacts.yaml"
      - ".github/workflows/release.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/sendbox-bpf/**"
      - "crates/sendbox-bundle/**"
      - "crates/sendbox-exec/**"
      - "fuzz/bpf/**"
      - "guest/sendbox-guest/**"
      - "native/bpf/**"
      - "packaging/guest/**"
      - "packaging/release/**"
      - "scripts/qualify-setup-release.sh"
      - "setup.sh"
      - "docs/architecture/guest-artifact-bundles.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guest-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Strict C, Rust, fuzz, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.33.0
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Cache pinned quality build dependencies
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/guest/Dockerfile
          platforms: linux/amd64
          target: quality-base
          build-args: CARGO_BUILD_JOBS=2
          cache-from: type=gha,scope=guest-quality-amd64
          cache-to: type=gha,mode=max,scope=guest-quality-amd64
          outputs: type=cacheonly

      - name: Run fresh quality checks
        run: |
          docker buildx build \
            --no-cache-filter quality \
            --platform linux/amd64 \
            --build-arg CARGO_BUILD_JOBS=2 \
            --target quality \
            --output type=cacheonly \
            -f packaging/guest/Dockerfile \
            .

  artifact-build:
    name: Clean ${{ matrix.architecture }} bundle (${{ matrix.attempt }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        architecture: [amd64, arm64]
        attempt: [first, second]
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.33.0
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Create explicit CI-only signing key
        run: |
          printf '77777777777777777777777777777777' >"$RUNNER_TEMP/guest-artifact-ci.key"
          chmod 0400 "$RUNNER_TEMP/guest-artifact-ci.key"

      - name: Build independent bundle without cache
        run: |
          docker buildx build \
            --no-cache \
            --platform "linux/${{ matrix.architecture }}" \
            --build-arg CARGO_BUILD_JOBS=2 \
            --target artifact \
            --secret "id=release_signing_key,src=$RUNNER_TEMP/guest-artifact-ci.key" \
            --output "type=local,dest=dist/${{ matrix.architecture }}/${{ matrix.attempt }}" \
            -f packaging/guest/Dockerfile \
            .

      - name: Export OCI layout from the same build
        if: matrix.attempt == 'first'
        run: |
          docker buildx build \
            --platform "linux/${{ matrix.architecture }}" \
            --build-arg CARGO_BUILD_JOBS=2 \
            --target image \
            --secret "id=release_signing_key,src=$RUNNER_TEMP/guest-artifact-ci.key" \
            --output "type=oci,dest=dist/${{ matrix.architecture }}/guest-image.oci.tar" \
            -f packaging/guest/Dockerfile \
            .

      - name: Archive build output with file modes intact
        run: |
          tar -cf "$RUNNER_TEMP/bundle.tar" \
            -C "dist/${{ matrix.architecture }}/${{ matrix.attempt }}" .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guest-build-${{ matrix.architecture }}-${{ matrix.attempt }}
          path: ${{ runner.temp }}/bundle.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  artifacts:
    name: Reproducible ${{ matrix.architecture }} bundle
    needs: artifact-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: guest-build-${{ matrix.architecture }}-*
          path: ${{ runner.temp }}/guest-builds

      - name: Restore independent build outputs
        run: |
          for attempt in first second; do
            output="dist/${{ matrix.architecture }}/$attempt"
            mkdir -p "$output"
            tar -xf \
              "$RUNNER_TEMP/guest-builds/guest-build-${{ matrix.architecture }}-$attempt/bundle.tar" \
              -C "$output"
          done

      - name: Verify byte reproducibility and minimal inventory
        run: |
          for file in \
            sendbox-guest-rootfs.tar \
            sendbox-guest-rootfs.tar.sha256 \
            manifest.json \
            manifest.sig \
            release-metadata.json \
            release-metadata.sig \
            release-public.key \
            inventory.json \
            sbom.spdx.json \
            verification-report.json \
            btf-archive.sha256 \
            vmlinux.sha256 \
            core-relocation.sha256 \
            sendbox-guest.static.txt \
            sendbox-exec-launcher.static.txt; do
            cmp \
              "dist/${{ matrix.architecture }}/first/$file" \
              "dist/${{ matrix.architecture }}/second/$file"
          done
          tar -tf "dist/${{ matrix.architecture }}/first/sendbox-guest-rootfs.tar" \
            | tee "$RUNNER_TEMP/rootfs-files.txt"
          if grep -E '(^|/)(python|node|npm|clang|gcc|bpftrace)(/|$)' \
              "$RUNNER_TEMP/rootfs-files.txt"; then
            echo "forbidden development tool found in rootfs" >&2
            exit 1
          fi
          cat "dist/${{ matrix.architecture }}/first/sendbox-guest.static.txt"
          cat "dist/${{ matrix.architecture }}/first/sendbox-exec-launcher.static.txt"

      - name: Verify installed bundle as an unprivileged host user
        run: |
          output="dist/${{ matrix.architecture }}/first"
          mkdir "$RUNNER_TEMP/installed-bundle"
          tar -xf "$output/sendbox-guest-rootfs.tar" \
            -C "$RUNNER_TEMP/installed-bundle"
          sudo chown -R 0:0 "$RUNNER_TEMP/installed-bundle"
          sudo chown 0:0 "$output/release-public.key"
          test "$(stat -c '%a' "$RUNNER_TEMP/installed-bundle/bin/sendbox-guest")" = 555
          test "$(stat -c '%a' "$RUNNER_TEMP/installed-bundle/manifest.json")" = 444
          test "$(stat -c '%a' "$output/release-public.key")" = 444
          case "${{ matrix.architecture }}" in
            amd64) architecture=x86_64 ;;
            arm64) architecture=aarch64 ;;
          esac
          cargo run --locked -p sendbox-bundle -- verify \
            --root "$RUNNER_TEMP/installed-bundle" \
            --public-key "$output/release-public.key" \
            --architecture "$architecture" \
            --trust-root-id external-release-root \
            --host-version 0.1.0 \
            --guest-version 0.1.0 \
            --minimum-release-sequence 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guest-artifacts-${{ matrix.architecture }}
          path: dist/${{ matrix.architecture }}/first/
          compression-level: 1
          if-no-files-found: error

  live-event:
    name: Privileged live BPF (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            platform: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install loader build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang libelf-dev libzstd-dev make pkg-config zlib1g-dev

      - name: Export architecture-specific BPF object
        run: |
          docker build \
            --no-cache \
            --platform "linux/${{ matrix.platform }}" \
            --target bpf-artifact \
            --output "type=local,dest=dist/bpf" \
            -f packaging/guest/Dockerfile \
            .

      - name: Mount kernel tracefs if needed
        run: |
          if ! mountpoint -q /sys/kernel/tracing; then
            sudo mount -t tracefs tracefs /sys/kernel/tracing
          fi

      - name: Compile and run live event smoke test
        run: |
          cargo test --locked -p sendbox-bpf --test live --no-run
          test_binary="$(
            find target/debug/deps -maxdepth 1 -type f -perm -111 \
              -name 'live-*' | sort | head -1
          )"
          test -n "$test_binary"
          sudo env \
            SENDBOX_BPF_LIVE=1 \
            SENDBOX_BPF_OBJECT="$PWD/dist/bpf/observe.bpf.o" \
            "$test_binary" --exact observes_exec_and_syscall_events_when_explicitly_enabled --nocapture
