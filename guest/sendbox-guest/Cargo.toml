[package]
name = "sendbox-guest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["execution-broker"]
execution-broker = ["dep:sendbox-egress", "dep:sendbox-exec", "dep:sendbox-policy"]

[dependencies]
async-trait.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
getrandom = "0.3.4"
libc.workspace = true
rustix.workspace = true
sendbox-bootstrap = { path = "../../crates/sendbox-bootstrap" }
sendbox-core = { path = "../../crates/sendbox-core" }
sendbox-egress = { path = "../../crates/sendbox-egress", optional = true }
sendbox-exec = { path = "../../crates/sendbox-exec", optional = true }
sendbox-git = { path = "../../crates/sendbox-git" }
sendbox-mcp = { path = "../../crates/sendbox-mcp" }
sendbox-policy = { path = "../../crates/sendbox-policy", optional = true }
sendbox-protocol = { path = "../../crates/sendbox-protocol" }
sendbox-secrets = { path = "../../crates/sendbox-secrets" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "net", "rt-multi-thread", "signal"] }
tokio-util.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
